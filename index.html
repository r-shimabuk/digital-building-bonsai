<script type="module">
import * as THREE from 'three';
const C=document.getElementById('c'),stage=document.getElementById('stage');let X=null;
const GRN='#009848',GRNK='#007A3B',BEI='#ECD1A9',BEIK='#CEB084';
const RED='#E41E25',BLU='#006DB5',YEL='#FCBB00',REDK='#B02321',BLUK='#00578F',YELD='#F49415',K='#2B2B2A',KR='#232120',K60='#8A8989',K80='#5C5B5B',CON='#DBD8C6',WH='#FFFFFF',WIRE='#B8733A';

function pickCol(){return Math.random()<.68?6:7}
const WT=['grid','slit','black','port','arch','louver','door','grid','slit'];
const FLOWER=new Set(['tree','pine','cactus','lampost','pool','clock','shrub','palm','block','spire','spiral','antenna','tank','dome','gable','mansard','chimney','onion','saw','dish','launcher']);
const ORDER={root:0,trunk:1,elevator:1,node:2,bridge:2,branch:3,leaf:4,stair:4,escape:4,pane:4,gstair:4};const ord=r=>ORDER[r]??5;
const PMAX=6;

const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[(Math.random()*a.length)|0],chance=p=>Math.random()<p;
let tex=null;function mkTex(){const n=160,g=document.createElement('canvas');g.width=g.height=n;const q=g.getContext('2d');for(let i=0;i<n*n*0.09;i++){const d=Math.random()<.55;q.fillStyle=d?`rgba(35,33,32,${(.04+Math.random()*.09).toFixed(3)})`:`rgba(255,255,255,${(.05+Math.random()*.12).toFixed(3)})`;q.fillRect(Math.random()*n,Math.random()*n,Math.random()<.8?1:2,1)}

function mkGlass(){mkTex();const n=8,g=document.createElement('canvas');g.width=g.height=n;const q=g.getContext('2d');q.fillStyle='#1E2536';q.fillRect(0,0,n,n);q.fillStyle='#242C40';q.fillRect(0,0,n,n/2);glass=X.createPattern(g,'repeat')}
function mkNoise(){noise=document.createElement('canvas');noise.width=Math.ceil(W);noise.height=Math.ceil(H);const q=noise.getContext('2d');const cols=['0,161,228','230,12,128','255,237,0','43,43,42'];for(let i=0;i<W*H*0.035;i++){q.fillStyle=`rgba(${cols[(Math.random()*4)|0]},${(0.08+Math.random()*0.16).toFixed(2)})`;q.fillRect((Math.random()*W)|0,(Math.random()*H)|0,1,1)}}

/* ---------- tree state ---------- */
let T,run=true,spd=1.3,acc=0,now=0,line=null,serial=1;const mirrorMode='auto';
function newTree(){
  const accent=pick([0,0,1,2,3,4]),col=pick([6,6,7]);
  T={blocks:new Map(),occ:new Map(),id:0,wires:[],jins:[],cuts:3,events:0,hero:pick(HEROES),heroId:null,done:false,fails:0,
     sym:Math.pow(Math.random(),2)*0.7, lean:rnd(0.1,0.35), style:(r=>r<.18?'chokkan':r<.55?'shakan':r<.85?'moyogi':'fuki')(Math.random()), dir:chance(.5)?1:-1, flipIn:ri(2,3), nodeEvery:ri(2,4),
     trunkCol:col, branchCol:pick([6,7]), accent, apex:null, branches:[]};
  const rw=1, rh=ri(1,2);T.potF=W/H>1.25?0.5+rnd(-0.16,0.22):0.5;if(T.potF>0.56)T.dir=-1;else if(T.potF<0.44)T.dir=1;
  const r=place({role:'root',x:-Math.floor(rw/2),y:0,w:rw,h:rh,parent:null,col:T.trunkCol});
  T.apex={x:0,y:rh,w:T.style==='chokkan'?ri(1,2):2,parent:r.id,since:0,alive:true};
  if(T.apex.w===2)T.apex.x=chance(.5)?-1:0;
}
const ck=(c,r)=>c+','+r;const PLANTS=new Set(['tree','pine','palm','cactus','shrub']);
function inBounds(x,y,w,h){if(y<0||y+h>MAXR)return false;for(let c=x;c<x+w;c++){if(c<-MAXL||c>MAXRC)return false;if(y===0&&Math.abs(c)>POT)return false}return true}
function free(x,y,w,h){for(let c=x;c<x+w;c++)for(let r=y;r<y+h;r++)if(T.occ.has(ck(c,r)))return false;return true}
function rectScreen(x,y,w,h){return{l:CX+(x-0.5)*U,r:CX+(x+w-0.5)*U,t:G-(y+h)*V,b:G-y*V}}
function segHitsRect(s,R){const pts=[[s.x0,s.y0],[s.x1,s.y1]];const inside=([px,py])=>px>R.l&&px<R.r&&py>R.t&&py<R.b;if(pts.some(inside))return true;
  const edges=[[R.l,R.t,R.r,R.t],[R.r,R.t,R.r,R.b],[R.r,R.b,R.l,R.b],[R.l,R.b,R.l,R.t]];return edges.some(e=>segX(s.x0,s.y0,s.x1,s.y1,...e))}
function segX(a,b,c,d,e,f,g,h){const o=(p,q,r,s,t,u)=>Math.sign((r-p)*(u-q)-(s-q)*(t-p));return o(a,b,c,d,e,f)!==o(a,b,c,d,g,h)&&o(e,f,g,h,a,b)!==o(e,f,g,h,c,d)}
function wired(x,y,w,h){const R=rectScreen(x,y,w,h);return T.wires.some(s=>segHitsRect(s,R))}
function can(x,y,w,h){return inBounds(x,y,w,h)&&free(x,y,w,h)&&!wired(x,y,w,h)}
function place(b){b.id=++T.id;b.born=now;b.t0=b.t0||Date.now();b.deco=[];b.wt=b.wt||pick(WT);T.blocks.set(b.id,b);for(let c=b.x;c<b.x+b.w;c++)for(let r=b.y;r<b.y+b.h;r++)T.occ.set(ck(c,r),b.id);return b}
let townMode=false;function groundRow(c){return townMode||Math.abs(c)<=POT?0:-1}
function reach(c,y,sup){const g=groundRow(c);for(let r=y-1;r>=Math.max(g,y-PMAX);r--){const o=T.occ.get(ck(c,r));if(o)return(!sup||sup.has(o))?r+1:null}return y-g<=PMAX?g:null}
function pilOK(b){return b.pil!=null&&reach(b.pil,b.y,null)!==null}
function overhang(b){if(b.y===0)return onPot(b)?0:null;for(let c=b.x;c<b.x+b.w;c++)if(T.occ.has(ck(c,b.y-1)))return 0;
  let best=Infinity;const see=(c,r)=>{const o=T.occ.get(ck(c,r));if(o){const n=T.blocks.get(o);best=Math.min(best,(n.oh||0)+1)}};
  for(let r=b.y;r<b.y+b.h;r++){see(b.x-1,r);see(b.x+b.w,r)}for(let c=b.x;c<b.x+b.w;c++)see(c,b.y+b.h);return best===Infinity?null:best}
function tryPlace(b){if(!can(b.x,b.y,b.w,b.h))return null;if(PLANTS.has(b.role)){const side=s=>{for(let r=b.y;r<b.y+b.h;r++){const o=T.occ.get(ck(s<0?b.x-1:b.x+b.w,r));if(o&&!PLANTS.has(T.blocks.get(o).role))return true}return false};const L=side(-1),Rr=side(1);b.ws=L&&Rr?0:L?-1:Rr?1:0}const ap=T.apex;if(ap&&ap.alive&&!['trunk','elevator','node'].includes(b.role)&&b.x<ap.x+ap.w&&b.x+b.w>ap.x&&b.y+b.h>ap.y&&b.y<ap.y+3)return null;let oh=overhang(b);if(oh===null)return null;
  if(b.role==='bridge')oh=Math.max(0,oh-1);
  if(oh>=3){const cs=[];for(let c=b.x;c<b.x+b.w;c++)cs.push(c);cs.sort((p,q)=>Math.abs(q)-Math.abs(p));const c=cs.find(c=>reach(c,b.y,null)!==null);if(c===undefined)return null;b.pil=c;oh=0}
  b.oh=oh;return place(b)}
function symP(kind){if(mirrorMode==='full')return 1;if(mirrorMode==='trunk')return kind==='trunk'?1:T.sym*0.5;return kind==='trunk'?Math.min(1,T.sym*1.4):T.sym}
function mirrorOf(b){const mx=-(b.x+b.w-1);if(mx===b.x)return null;const p=T.blocks.get(b.parent);if(!p)return null;
  const pc=p.x+((b.x>=p.x)?p.w-1:0);const owner=T.occ.get(ck(-pc,p.y));if(!owner)return null;
  return {...b,x:mx,parent:owner,deco:undefined,id:undefined,mirror:true}}

/* ---------- growth (L-system-like modules: apex, node, bud, leaf, flower) ---------- */
function stepTrunk(){const a=T.apex;
  if(a.since>=T.nodeEvery){const w=a.w+(chance(.5)?1:0),x=a.x-(w>a.w&&chance(.5)?1:0);
    const n=tryPlace({role:'node',x,y:a.y,w,h:1,parent:a.parent,col:T.trunkCol});
    if(n){a.parent=n.id;a.y+=1;a.since=0;a.x=x+Math.floor((w-a.w)/2);budsFrom(n);return true}}
  const slant=T.style&&T.style!=='chokkan';const h=slant?ri(1,2):ri(1,3);let w=a.w;
  if(!slant&&a.y>MAXR*0.45&&w>1&&chance(.35)){w-=1;if(chance(.5))a.x+=1}
  if(slant&&w<2)w=2;
  let x=a.x;
  if(slant){if(T.style==='moyogi'){T.flipIn--;if(T.flipIn<=0){T.dir*=-1;T.flipIn=ri(2,3)}}
    if(chance(T.style==='moyogi'?.7:.78)){const nx=x+T.dir;if(nx>=-MAXL&&nx+w-1<=MAXRC)x=nx;else if(T.style!=='moyogi')T.dir=T.dir}}
  else{const centered=mirrorMode!=='auto'||chance(symP('trunk'));if(!centered&&chance(T.lean))x+=chance(.5)?1:-1}
  const role=(w===1&&h>=2&&chance(.6))?'elevator':'trunk';
  let b=tryPlace({role,x,y:a.y,w,h:role==='elevator'?3:h,parent:a.parent,col:T.trunkCol});
  if(!b&&x!==a.x)b=tryPlace({role,x:a.x,y:a.y,w,h:role==='elevator'?3:h,parent:a.parent,col:T.trunkCol});
  if(!b){bloom(T.blocks.get(a.parent),true);a.alive=false;return true}
  if(b.role==='trunk'&&b.w>=2&&b.h>=2&&chance(.4))b.sc=Math.min(b.w,b.h);
  a.x=b.x;a.y=b.y+b.h;a.w=b.w;a.parent=b.id;a.since+=1;return true}
function budsFrom(n){const both=T.style!=='fuki'&&chance(Math.max(0.35,symP('branch')));const first=T.style==='fuki'?T.dir:T.style==='shakan'&&chance(.6)?-T.dir:chance(.5)?1:-1;
  const sides=both?[first,-first]:[first];
  for(const s of sides)T.branches.push({side:s,x:s>0?n.x+n.w:n.x-1,y:n.y,len:ri(1,Math.round(4*WIDE)),parent:n.id,alive:true,mirrorTwin:both})}
function stepBranch(br){
  const big=chance(.25),w=big?2:ri(1,3),h=big?2:1,up=chance(.22)?1:0;const x=br.side>0?br.x:br.x-w+1,y=br.y+up;

  if(!b){bloom(T.blocks.get(br.parent),false,br.side);br.alive=false;return}

  br.x=br.side>0?b.x+b.w:b.x-1;br.y=b.y;br.parent=b.id;br.len-=1;
  if(br.len<=0){bloom(b,false,br.side);br.alive=false}}
const FLOWERS=[{role:'clock',w:1,h:3,k:1.1},{role:'block',w:1,h:2,k:1.2},{role:'block',w:1,h:1,k:.6},{role:'tank',w:2,h:2,k:.45},{role:'chimney',w:1,h:2,k:.5},{role:'dish',w:1,h:1,k:.8},{role:'saw',w:3,h:1,k:.5},{role:'gable',w:3,h:1,k:.4},{role:'antenna',w:1,h:4,k:.35},{role:'spire',w:1,h:4,k:.25},{role:'spiral',w:1,h:3,k:.3},{role:'dome',w:2,h:2,k:.2},{role:'onion',w:1,h:2,k:.15},{role:'mansard',w:2,h:1,k:.2},{role:'tree',w:1,h:1,k:1.1},{role:'tree',w:2,h:1,k:.6},{role:'pine',w:1,h:1,k:1.0},{role:'pine',w:2,h:1,k:.6},{role:'palm',w:1,h:1,k:.8},{role:'cactus',w:1,h:1,k:.55},{role:'shrub',w:1,h:1,k:.9},{role:'shrub',w:2,h:1,k:.6}];
function wshuffle(a){return a.map(f=>({f,r:Math.pow(Math.random(),1/f.k)})).sort((p,q)=>q.r-p.r).map(o=>o.f)}

  for(const f of opts){const xs=top?[b.x+Math.floor((b.w-f.w)/2)]:[side>0?b.x+b.w-f.w:b.x, b.x];
    for(const x of xs){const r=tryPlace({role:f.role,x,y:b.y+b.h,w:f.w,h:f.h,parent:b.id,col:f.role==='block'?T.accent:pickCol(),rc:chance(.5)?T.accent:6});if(r)return r}}}

/* ---------- slow growth: one building takes about a week; saved and caught up while closed ---------- */
const SPEED=(()=>{try{return Math.max(1,+new URLSearchParams(location.search).get('speed')||1)}catch(e){return 1}})();

    popDelta.textContent=(popAcc>0?'+':'−')+Math.abs(popAcc);popDelta.className='delta on '+(popAcc>0?'plus':'minus');clearTimeout(popT);popT=setTimeout(()=>popDelta.classList.remove('on'),2200)}

const STYLE_NAME={chokkan:['Chokkan','直幹'],shakan:['Shakan','斜幹'],moyogi:['Moyogi','模様木'],fuki:['Fukinagashi','吹き流し']};

const hintEl=document.getElementById('hint');let hintT=0;const hint=(t,ja,keep)=>{hintEl.textContent=t;if(ja){const sm=document.createElement('small');sm.textContent=ja;hintEl.appendChild(sm)}hintEl.style.opacity=t?1:0;clearTimeout(hintT);if(!keep)hintT=setTimeout(()=>hintEl.style.opacity=0,3500)};
